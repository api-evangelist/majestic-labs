name: Majestic Labs
description: >-
  Majestic Labs is a semiconductor and AI-infrastructure company building
  power-efficient AI servers that put memory first. Its rearchitected server
  uses custom chips that disaggregate memory from compute, giving processors
  direct access to a massive uniform, high-bandwidth memory pool (reportedly up
  to 128 TB per server and roughly 1000x more memory available to compute than
  a conventional design). The company claims a single Majestic rack can hold the
  memory capacity of about 25 Nvidia NVL72-class racks while consuming a fraction
  of the power, targeting frontier language models, agentic and reasoning AI,
  graph neural networks, and video generation. Founded by Ofer Shacham, Sha
  Rabii, and Masumi Reynders, Majestic Labs is backed by Lux Capital (2024). This
  profile was added to the API Evangelist network as a company lead; the company
  does not currently publish a public developer/API surface.
